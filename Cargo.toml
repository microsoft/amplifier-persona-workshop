[package]
name = "twin-workbench"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/microsoft/amplifier-persona-workshop"
description = "Person-specific communication and working-style profiles, evaluation, and portable exports."

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
get_if_addrs = "0.5"
libc = "0.2"
pam-client = "0.5"
rand = "0.8"
rcgen = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

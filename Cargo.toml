[package]
name = "persona-workshop"
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/microsoft/amplifier-persona-workshop"
description = "Person-specific communication and working-style profiles, evaluation, and portable exports."

[dependencies]
amplifier-acp-connection = { git = "https://github.com/microsoft/amplifier-constellation", rev = "e0d6a03fd342b295d349b633d400376efbbe2c40" }
amplifier-native-platform = { git = "https://github.com/microsoft/amplifier-constellation", rev = "178aed21d183adbe95acff7c22e2adfd0da3d268", features = ["local-auth"] }
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
if-addrs = "0.15"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rand = "0.8"
rcgen = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.0.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
pam-client = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
